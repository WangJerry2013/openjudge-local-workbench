<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>目录 · OpenJudge 刷题台</title>
  <style>
    :root{--blue:#3157d5;--bg:#f5f7fb;--line:#e1e6ef;--text:#172033;--muted:#697386;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{height:62px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px}h1{font-size:19px;margin:0}.nav{display:flex;gap:5px}.nav a{padding:7px 10px;border-radius:7px;text-decoration:none;color:#475467}.nav a.active,.nav a:hover{background:#eef2ff;color:#2949ac}main{max-width:1040px;margin:30px auto;padding:0 20px}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}.toolbar h2{margin:0;font-size:22px}.grow{flex:1}.breadcrumb{margin:0 0 18px;color:var(--muted)}button{font:inherit;border:0;border-radius:7px;padding:8px 12px;cursor:pointer;background:#eef2ff;color:#2949ac}button:hover{background:#dfe7ff}button:disabled{opacity:.5;cursor:wait}.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.folder{min-height:102px;padding:17px;text-align:left;display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:11px;box-shadow:0 2px 7px #10182809}.folder:hover{border-color:#aebce9;box-shadow:0 8px 22px #3157d51c}.folder-icon{position:relative;width:40px;height:29px;flex:none;border-radius:4px;background:#f5b942}.folder-icon:before{content:'';position:absolute;left:3px;top:-6px;width:18px;height:8px;border-radius:4px 4px 0 0;background:#f8cd68}.folder div{min-width:0}.folder strong,.folder small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder small{color:var(--muted);margin-top:3px}.problem{min-height:80px}.problem .folder-icon{background:#e8edfb}.problem .folder-icon:before{background:#cbd6f6}.open{margin-left:auto;align-self:flex-end;white-space:nowrap;text-decoration:none;color:#2949ac}.empty{padding:32px;background:#fff;border:1px dashed #cbd2dc;border-radius:11px;color:var(--muted);text-align:center}.danger{background:transparent;color:var(--bad);padding:5px 0}.message{color:var(--bad);min-height:22px}@media(max-width:650px){header{padding:0 14px}header .sub{display:none}main{margin-top:20px}.folders{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>OpenJudge 刷题台</h1><nav class="nav"><a href="/home">首页</a><a href="/catalog" class="active">目录</a></nav><span class="grow"></span><span class="sub">按文件夹浏览团队内容</span></header>
  <main>
    <div class="toolbar"><button id="back">← 上一层</button><h2 id="title">目录</h2><span class="grow"></span><button id="add">添加团队</button></div>
    <p id="breadcrumb" class="breadcrumb">团队</p><div id="message" class="message"></div><section id="folders" class="folders"></section>
  </main>
<script>
const $=id=>document.getElementById(id),teamsKey='oj-team-list-v1',defaultGroup='hihocoder';
function normalize(value){const text=String(value||'').trim().toLowerCase();if(/^[a-z0-9-]+$/.test(text))return text;try{const host=new URL(text.includes('://')?text:`http://${text}`).hostname;return (host.match(/^([a-z0-9-]+)\.openjudge\.cn$/)||[])[1]||''}catch(_){return''}}
function teams(){try{const stored=JSON.parse(localStorage.getItem(teamsKey)||'[]'),items=[],seen=new Set();for(const item of stored){const slug=normalize(typeof item==='string'?item:item.slug);if(slug&&!seen.has(slug)){seen.add(slug);items.push({slug,title:typeof item==='object'?String(item.title||''):''})}}return items.length?items:[{slug:defaultGroup,title:''}]}catch(_){return[{slug:defaultGroup,title:''}]}}
function saveTeams(items){localStorage.setItem(teamsKey,JSON.stringify(items))}
const query=new URLSearchParams(location.search),group=normalize(query.get('group')),section=query.get('section')==='contests'?'contests':query.get('section')==='practices'?'practices':'',course=(query.get('course')||'').replace(/[^A-Za-z0-9_-]/g,'');
function go(next={}){const params=new URLSearchParams(next);location.href=`/catalog${params.toString()?`?${params}`:''}`}
function folder(title,meta,action,kind=''){const button=document.createElement('button'),icon=document.createElement('span'),text=document.createElement('div'),name=document.createElement('strong'),small=document.createElement('small');button.className=`folder ${kind}`;icon.className='folder-icon';name.textContent=title;small.textContent=meta||'';text.append(name,small);button.append(icon,text);button.onclick=action;return button}
function problem(item,type){const link=document.createElement('a'),icon=document.createElement('span'),text=document.createElement('div'),name=document.createElement('strong'),small=document.createElement('small'),params=new URLSearchParams({type:type==='contests'?'比赛':'题单',problem:item.id});link.className='folder problem';link.href=`/${encodeURIComponent(group)}/${encodeURIComponent(course)}?${params}`;link.target='_blank';link.rel='noopener';icon.className='folder-icon';name.textContent=`${item.id} ${item.title||''}`;small.textContent='在新标签页打开题目';text.append(name,small);link.append(icon,text);return link}
function parent(){if(course)return go({group,section});if(section)return go({group});if(group)return go();history.back()}
async function render(){const list=$('folders');list.replaceChildren();$('back').onclick=parent;$('back').disabled=!group;if(!group){$('title').textContent='团队目录';$('breadcrumb').textContent='团队';for(const item of teams()){const node=folder(item.title||item.slug,`${item.slug}.openjudge.cn`,()=>go({group:item.slug}));const remove=document.createElement('button');remove.className='danger';remove.textContent='删除';remove.onclick=event=>{event.stopPropagation();saveTeams(teams().filter(x=>x.slug!==item.slug));render()};node.querySelector('div').append(remove);list.append(node)}return}try{$('message').textContent='';$('title').textContent='读取中…';const response=await fetch(`/api/team?group=${encodeURIComponent(group)}`),data=await response.json();if(!response.ok)throw new Error(data.error||'读取失败');const own=teams(),matched=own.find(x=>x.slug===group);if(matched&&data.title&&matched.title!==data.title){matched.title=data.title;saveTeams(own)}if(!section){$('title').textContent=data.title||group;$('breadcrumb').textContent=`团队 / ${group}.openjudge.cn`;list.append(folder('比赛',`${data.contests?.length||0} 个比赛`,()=>go({group,section:'contests'})),folder('练习与题单',`${data.practices?.length||0} 个题单`,()=>go({group,section:'practices'})));return}const collections=data[section]||[];if(!course){$('title').textContent=section==='contests'?'比赛':'练习与题单';$('breadcrumb').textContent=`团队 / ${data.title||group} / ${$('title').textContent}`;if(!collections.length)list.innerHTML='<div class="empty">这里还没有可读取的内容。</div>';collections.forEach(item=>list.append(folder(item.title||item.id,[item.id,item.count!=null?`${item.count} 题`:''].filter(Boolean).join(' · '),()=>go({group,section,course:item.id}))));return}const selected=collections.find(item=>item.id===course);$('title').textContent=selected?.title||course;$('breadcrumb').textContent=`团队 / ${data.title||group} / ${section==='contests'?'比赛':'练习与题单'} / ${$('title').textContent}`;const responseProblems=await fetch(`/api/problems?group=${encodeURIComponent(group)}&course=${encodeURIComponent(course)}`),problemData=await responseProblems.json();if(!responseProblems.ok)throw new Error(problemData.error||'读取题目失败');if(!problemData.problems?.length)list.innerHTML='<div class="empty">这里还没有题目。</div>';problemData.problems.forEach(item=>list.append(problem(item,section)))}catch(error){$('title').textContent='目录';$('message').textContent=`读取失败：${error.message}`;list.innerHTML='<div class="empty">请稍后重试。</div>'}}
$('add').onclick=()=>{const slug=normalize(prompt('输入团队二级域名或完整地址，例如 hihocoder'));if(!slug)return;const items=teams();if(!items.some(item=>item.slug===slug)){items.push({slug,title:''});saveTeams(items)}go({group:slug})};render();
</script>
</body>
</html>
