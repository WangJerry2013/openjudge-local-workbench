<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>目录 · OpenJudge 刷题台</title>
  <style>
    :root{--blue:#3157d5;--bg:#f5f7fb;--line:#e1e6ef;--text:#172033;--muted:#697386;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{height:62px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px}h1{font-size:19px;margin:0}.nav{display:flex;gap:5px}.nav a{padding:7px 10px;border-radius:7px;text-decoration:none;color:#475467}.nav a.active,.nav a:hover{background:#eef2ff;color:#2949ac}.grow{flex:1}.sub{color:var(--muted);font-size:12px}main{max-width:1120px;margin:30px auto;padding:0 20px}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.toolbar h2{margin:0;font-size:22px}.back,.add{border:0;border-radius:7px;padding:8px 12px;background:#eef2ff;color:#2949ac;text-decoration:none;font:inherit;cursor:pointer}.back[aria-disabled="true"]{opacity:.45;pointer-events:none}.breadcrumb{margin:0 0 18px;color:var(--muted)}.message{min-height:22px;color:var(--bad)}.listing{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:11px}.listing table{width:100%;border-collapse:collapse;table-layout:fixed}.listing th{padding:9px 13px;text-align:left;background:#f8fafc;color:#667085;font-size:12px;font-weight:600;border-bottom:1px solid var(--line)}.listing td{padding:9px 13px;border-bottom:1px solid #edf0f4;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.listing tr:last-child td{border-bottom:0}.listing tbody tr:hover{background:#f7f9ff}.listing a{color:var(--text);text-decoration:none}.listing a.name{display:flex;align-items:center;gap:10px;font-weight:600}.listing a.name:hover{color:#2949ac}.file-icon{position:relative;width:25px;height:18px;flex:none;border-radius:3px;background:#f5b942}.file-icon:before{content:'';position:absolute;left:2px;top:-4px;width:11px;height:5px;border-radius:3px 3px 0 0;background:#f8cd68}.file-icon.problem{height:23px;background:#e9edfb;border:1px solid #cbd6f6}.file-icon.problem:before{display:none}.kind,.meta{color:var(--muted);font-size:12px}.delete{border:0;background:transparent;color:var(--bad);font:inherit;cursor:pointer;padding:2px 0}.empty{padding:34px;color:var(--muted);text-align:center}@media(max-width:650px){header{padding:0 14px}.sub{display:none}main{margin-top:20px;padding:0 12px}.listing th:nth-child(2),.listing td:nth-child(2){display:none}.listing th:nth-child(1){width:auto!important}}
  </style>
</head>
<body>
  <header><h1>OpenJudge 刷题台</h1><nav class="nav"><a href="/home">首页</a><a href="/catalog" class="active">目录</a></nav><span class="grow"></span><span class="sub">文件夹式列表浏览</span></header>
  <main>
    <div class="toolbar"><a id="back" class="back" href="/catalog">← 上一层</a><h2 id="title">目录</h2><span class="grow"></span><button id="add" class="add">添加团队</button></div>
    <p id="breadcrumb" class="breadcrumb">团队</p><div id="message" class="message"></div>
    <section class="listing"><table><thead><tr><th style="width:46%">名称</th><th style="width:34%">信息</th><th style="width:20%">类型</th></tr></thead><tbody id="items"></tbody></table><div id="empty" class="empty" hidden></div></section>
  </main>
<script>
const $=id=>document.getElementById(id),teamsKey='oj-team-list-v1',teamCacheKey='oj-team-directory-cache-v1',courseCacheKey='oj-course-list-cache-v1',defaultGroup='hihocoder';
function normalize(value){const text=String(value||'').trim().toLowerCase();if(/^[a-z0-9-]+$/.test(text))return text;try{const host=new URL(text.includes('://')?text:`http://${text}`).hostname;return(host.match(/^([a-z0-9-]+)\.openjudge\.cn$/)||[])[1]||''}catch(_){return''}}
function read(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(_){return{}}}function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(_){}}
function teams(){const stored=read(teamsKey),raw=Array.isArray(stored)?stored:[],items=[],seen=new Set();for(const item of raw){const slug=normalize(typeof item==='string'?item:item.slug);if(slug&&!seen.has(slug)){seen.add(slug);items.push({slug,title:typeof item==='object'?String(item.title||''):''})}}return items.length?items:[{slug:defaultGroup,title:''}]}
function saveTeams(items){write(teamsKey,items)}
const query=new URLSearchParams(location.search),group=normalize(query.get('group')),section=query.get('section')==='contests'?'contests':query.get('section')==='practices'?'practices':'',course=(query.get('course')||'').replace(/[^A-Za-z0-9_-]/g,'');
function go(next={}){const params=new URLSearchParams(next);location.href=`/catalog${params.toString()?`?${params}`:''}`}
function cachedTeam(slug){return read(teamCacheKey)[slug]?.data||null}function cacheTeam(slug,data){const all=read(teamCacheKey);all[slug]={data,updatedAt:Date.now()};write(teamCacheKey,all)}
function cachedCourse(slug,id){return read(courseCacheKey)[`${slug}/${id}`]?.problems||null}function cacheCourse(slug,id,problems){const all=read(courseCacheKey);all[`${slug}/${id}`]={problems,updatedAt:Date.now()};write(courseCacheKey,all)}
const teamUpdates=new Map(),courseUpdates=new Map();
async function fetchTeam(slug){if(teamUpdates.has(slug))return teamUpdates.get(slug);const task=(async()=>{const response=await fetch(`/api/team?group=${encodeURIComponent(slug)}`),data=await response.json();if(!response.ok)throw new Error(data.error||'读取失败');cacheTeam(slug,data);const all=teams(),item=all.find(x=>x.slug===slug);if(item&&data.title&&item.title!==data.title){item.title=data.title;saveTeams(all)}return data})().finally(()=>teamUpdates.delete(slug));teamUpdates.set(slug,task);return task}
async function teamData(slug){const cached=cachedTeam(slug);if(cached){fetchTeam(slug).catch(()=>{});return cached}return fetchTeam(slug)}
async function fetchCourse(slug,id){const key=`${slug}/${id}`;if(courseUpdates.has(key))return courseUpdates.get(key);const task=(async()=>{const response=await fetch(`/api/problems?group=${encodeURIComponent(slug)}&course=${encodeURIComponent(id)}`),data=await response.json();if(!response.ok)throw new Error(data.error||'读取题目失败');cacheCourse(slug,id,data.problems||[]);return data.problems||[]})().finally(()=>courseUpdates.delete(key));courseUpdates.set(key,task);return task}
async function courseData(slug,id){const cached=cachedCourse(slug,id);if(cached){fetchCourse(slug,id).catch(()=>{});return cached}return fetchCourse(slug,id)}
function setEmpty(text=''){const empty=$('empty');empty.hidden=!text;empty.textContent=text}
function row(title,meta,kind,href,problem=false,remove){const tr=document.createElement('tr'),nameCell=document.createElement('td'),metaCell=document.createElement('td'),kindCell=document.createElement('td'),link=document.createElement('a'),icon=document.createElement('span');link.className='name';link.href=href;icon.className=`file-icon${problem?' problem':''}`;link.append(icon,document.createTextNode(title));if(problem){link.target='_blank';link.rel='noopener'}nameCell.append(link);metaCell.className='meta';metaCell.textContent=meta||'';kindCell.className='kind';kindCell.textContent=kind;if(remove){const del=document.createElement('button');del.className='delete';del.textContent='删除';del.onclick=event=>{event.preventDefault();event.stopPropagation();remove()};kindCell.replaceChildren(del)}tr.append(nameCell,metaCell,kindCell);$('items').append(tr)}
function parent(){if(course)return go({group,section});if(section)return go({group});if(group)return go();history.back()}
async function render(){const list=$('items');list.replaceChildren();setEmpty();const back=$('back');back.onclick=event=>{event.preventDefault();parent()};back.setAttribute('aria-disabled',String(!group));if(!group){$('title').textContent='团队目录';$('breadcrumb').textContent='团队';for(const item of teams())row(item.title||item.slug,`${item.slug}.openjudge.cn`,'团队',`/catalog?group=${encodeURIComponent(item.slug)}`,false,()=>{saveTeams(teams().filter(x=>x.slug!==item.slug));render()});return}try{$('message').textContent='';$('title').textContent='读取中…';const data=await teamData(group);if(!section){$('title').textContent=data.title||group;$('breadcrumb').textContent=`团队 / ${group}.openjudge.cn`;row('比赛',`${data.contests?.length||0} 个比赛`,'文件夹',`/catalog?group=${encodeURIComponent(group)}&section=contests`);row('练习与题单',`${data.practices?.length||0} 个题单`,'文件夹',`/catalog?group=${encodeURIComponent(group)}&section=practices`);return}const collections=data[section]||[];if(!course){const label=section==='contests'?'比赛':'练习与题单';$('title').textContent=label;$('breadcrumb').textContent=`团队 / ${data.title||group} / ${label}`;if(!collections.length)setEmpty('这里还没有可读取的内容。');collections.forEach(item=>row(item.title||item.id,[item.id,item.count!=null?`${item.count} 题`:''].filter(Boolean).join(' · '),section==='contests'?'比赛':'题单',`/catalog?group=${encodeURIComponent(group)}&section=${section}&course=${encodeURIComponent(item.id)}`));return}const selected=collections.find(item=>item.id===course),kind=section==='contests'?'比赛':'题单';$('title').textContent=selected?.title||course;$('breadcrumb').textContent=`团队 / ${data.title||group} / ${kind} / ${$('title').textContent}`;const problems=await courseData(group,course);if(!problems.length)setEmpty('这里还没有题目。');problems.forEach(item=>{const params=new URLSearchParams({type:kind,problem:item.id});row(`${item.id} ${item.title||''}`,'在新标签页打开题目','题目',`/${encodeURIComponent(group)}/${encodeURIComponent(course)}?${params}`,true)})}catch(error){$('title').textContent='目录';$('message').textContent=`读取失败：${error.message}`;setEmpty('请稍后重试。')}}
$('add').onclick=()=>{const slug=normalize(prompt('输入团队二级域名或完整地址，例如 hihocoder'));if(!slug)return;const items=teams();if(!items.some(item=>item.slug===slug)){items.push({slug,title:''});saveTeams(items)}go({group:slug})};render();
</script>
</body>
</html>
