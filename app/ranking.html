<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenJudge 排行榜</title>
  <style>
    :root{--blue:#3157d5;--bg:#f4f6fa;--line:#dfe3ea;--text:#172033;--muted:#697386;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:5;height:62px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}h1{font-size:19px;margin:0}.grow{flex:1}button,a.btn{border:0;border-radius:7px;padding:9px 14px;background:var(--blue);color:#fff;text-decoration:none;cursor:pointer;font:inherit}.light{background:#eef2ff!important;color:#2949ac!important}main{max-width:1240px;margin:18px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.head h2{margin:0;font-size:16px}.scope{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #eaecf0;text-align:left}th{color:var(--muted);font-size:12px}tr:hover{background:#f7f8fc}.empty{padding:28px;text-align:center;color:var(--muted)}.error{color:var(--red);padding:20px;text-align:center}@media(max-width:800px){header{padding:0 12px}main{padding:0 10px 24px}}
  </style>
</head>
<body>
  <header><h1 id="pageTitle">排行榜</h1><span id="scope" class="scope"></span><span class="grow"></span><button id="refresh" class="light" title="刷新排行榜" aria-label="刷新排行榜">↻</button><a id="returnToProblem" class="btn light" title="返回题目" aria-label="返回题目">⌂</a></header>
  <main><section class="panel"><div class="head"><h2 id="title">排行榜</h2><span id="rankingNote" class="scope"></span></div><div id="content" class="empty">正在读取排行榜…</div></section></main>
  <script>
    const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),routeParts=location.pathname.split('/').filter(Boolean),route=routeParts[0]==='ranking'&&routeParts.length===3?{group:routeParts[1],course:routeParts[2]}:null,group=(route?.group||query.get('group')||'hihocoder').toLowerCase().replace(/[^a-z0-9-]/g,''),course=(route?.course||query.get('course')||'').replace(/[^A-Za-z0-9_-]/g,''),problem=(query.get('problem')||'').replace(/[^A-Za-z0-9_-]/g,''),collectionType=query.get('type')==='比赛'?'比赛':'题单',collectionLabel=collectionType==='比赛'?'比赛':'练习题单';$('pageTitle').textContent=`${collectionLabel}排行榜`;$('rankingNote').textContent=collectionType==='比赛'?'仅显示官网公开的比赛排名':'显示官网练习题单排名';$('scope').textContent=`${group}.openjudge.cn / ${course}`;const params=new URLSearchParams({type:collectionType});if(problem)params.set('problem',problem);const returnUrl=problem?`/${encodeURIComponent(group)}/${encodeURIComponent(course)}?${params}`:'/home';$('returnToProblem').href=returnUrl;history.replaceState(null,'',`/ranking/${encodeURIComponent(group)}/${encodeURIComponent(course)}?${params}`);
    function render(html){const page=new DOMParser().parseFromString(html,'text/html'),table=page.querySelector('table.standing')||page.querySelector('table');if(!table){$('content').className='empty';$('content').textContent='该比赛暂时没有可显示的排行榜。';return}table.querySelectorAll('script,style').forEach(node=>node.remove());table.querySelectorAll('a').forEach(link=>link.removeAttribute('href'));$('title').textContent=`排行榜 · ${course}`;const wrap=document.createElement('div');wrap.className='table-wrap';wrap.append(table);$('content').className='';$('content').replaceChildren(wrap)}
    async function load(){if(!course){$('content').className='error';$('content').textContent='比赛地址不正确。';return}const button=$('refresh');button.disabled=true;try{const r=await fetch(`/api/ranking?group=${encodeURIComponent(group)}&course=${encodeURIComponent(course)}`),data=await r.json();if(!r.ok)throw new Error(data.error||'读取失败');render(data.html)}catch(error){$('content').className='error';$('content').textContent=`读取排行榜失败：${error.message}`}finally{button.disabled=false}}
    $('refresh').onclick=load;load();
  </script>
</body>
</html>
